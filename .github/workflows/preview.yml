name: PR preview

# Static diner and console previews for same-repository PRs. Previews use their own Pages
# projects and a Pages-only token; they never touch staging, the Worker, the database or PostHog.
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - 'frontend/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/preview.yml'
  workflow_dispatch:
    inputs:
      pr:
        description: PR number whose preview deployments should be deleted
        required: true
        type: number

permissions:
  contents: read

concurrency:
  group: preview-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

env:
  DINER_PROJECT: peekaplate-diner-preview
  CONSOLE_PROJECT: peekaplate-console-preview
  WRANGLER_VERSION: 4.149.0
  MARKER: '<!-- peekaplate-preview -->'

jobs:
  build:
    # Fork and Dependabot PRs receive no Actions secrets, so they get CI only.
    if: >-
      github.event_name == 'pull_request' && github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      vars.PREVIEW_DEPLOYMENT_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.25.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.16.0
      - run: pnpm install --frozen-lockfile
      - name: Build both apps with analytics disabled
        env:
          VITE_POSTHOG_ENABLED: 'false'
          VITE_POSTHOG_KEY: ''
          VITE_POSTHOG_HOST: ''
          VITE_POSTHOG_ENVIRONMENT: ''
          VITE_POSTHOG_ALLOWED_ORIGIN: ''
        run: |
          pnpm --filter @peekaplate/diner build
          pnpm --filter @peekaplate/console build
          mkdir -p "$RUNNER_TEMP/preview"
          cp -R frontend/diner/dist "$RUNNER_TEMP/preview/diner"
          cp -R frontend/console/dist "$RUNNER_TEMP/preview/console"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-dist
          path: ${{ runner.temp }}/preview
          retention-days: 3
          if-no-files-found: error

  deploy:
    # Runs no PR code: it only uploads the built files, so the token is never exposed to the build.
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: preview
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.16.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: preview-dist
          path: preview
      - name: Deploy to the preview Pages projects
        id: deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Set preview CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Set preview CLOUDFLARE_PREVIEW_API_TOKEN"; exit 1; }
          branch="pr-$PR"
          for app in diner console; do
            # Keep previews out of search results.
            printf '/*\n  X-Robots-Tag: noindex\n' > "preview/$app/_headers"
            project="$DINER_PROJECT"
            test "$app" = console && project="$CONSOLE_PROJECT"
            npx --yes "wrangler@$WRANGLER_VERSION" pages deploy "preview/$app" \
              --project-name "$project" --branch "$branch" --commit-hash "$SHA" --commit-dirty=true
            url="https://$branch.$project.pages.dev"
            for attempt in 1 2 3 4 5 6; do
              curl -fsS -o /dev/null "$url" && break
              test "$attempt" = 6 && { echo "$url did not return 200"; exit 1; }
              sleep 10
            done
            echo "${app}_url=$url" >> "$GITHUB_OUTPUT"
          done
      - name: Post or update the preview comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          DINER_URL: ${{ steps.deploy.outputs.diner_url }}
          CONSOLE_URL: ${{ steps.deploy.outputs.console_url }}
        run: |
          body="$MARKER
          ### Preview
          | App | Link |
          | --- | --- |
          | Diner | $DINER_URL |
          | Console | $CONSOLE_URL |

          Built from \`${SHA:0:7}\`. Static pages only: no API, database or analytics. Deleted when this PR closes. See [preview guide](https://github.com/$REPO/blob/develop/docs/previews.md)."
          echo "$body" >> "$GITHUB_STEP_SUMMARY"
          id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"$MARKER\"))) | .id" | head -n1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api "repos/$REPO/issues/$PR/comments" -f body="$body" > /dev/null
          fi

  cleanup:
    if: >-
      vars.PREVIEW_DEPLOYMENT_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: preview
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Delete this PR's preview deployments
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Set preview CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Set preview CLOUDFLARE_PREVIEW_API_TOKEN"; exit 1; }
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          for project in "$DINER_PROJECT" "$CONSOLE_PROJECT"; do
            ids=""
            page=1
            while :; do
              result=$(curl -fsS -H "$auth" "$api/$project/deployments?env=preview&per_page=25&page=$page")
              found=$(echo "$result" | jq -r --arg b "pr-$PR" '.result[] | select(.deployment_trigger.metadata.branch == $b) | .id')
              ids="$ids $found"
              test "$(echo "$result" | jq '.result | length')" -lt 25 && break
              page=$((page + 1))
            done
            for id in $ids; do
              curl -fsS -X DELETE -H "$auth" "$api/$project/deployments/$id?force=true" > /dev/null
            done
            echo "$project: deleted $(echo $ids | wc -w) deployment(s) for pr-$PR" | tee -a "$GITHUB_STEP_SUMMARY"
          done
      - name: Mark the preview comment as removed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
        run: |
          id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"$MARKER\"))) | .id" | head -n1)
          test -n "$id" || exit 0
          gh api -X PATCH "repos/$REPO/issues/comments/$id" \
            -f body="$MARKER
          ### Preview
          Removed after this PR closed." > /dev/null
